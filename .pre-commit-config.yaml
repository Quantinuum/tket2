repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # Use the ref you want to point at
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            test_files/.*|
            .*/snapshots/.*|
            .*.snap|
            .*.snap.new|
            .release-please-manifest.json|
            .*.lock
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            test_files/.*|
            .*/snapshots/.*|
            .*.snap|
            .*.snap.new|
            .*.lock
          )$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      # Python-specific
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (tket)
        description: Format python code with `ruff`.
        entry: uv run ruff format tket scripts test_files
        language: system
        files: \.py$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: ruff-check
        name: ruff (tket)
        description: Check python code with `ruff`.
        entry: uv run ruff check --fix --exit-non-zero-on-fix tket scripts test_files
        language: system
        files: \.py$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: mypy-check-tket
        name: mypy (tket)
        description: Check tket Python code with `mypy`.
        entry: uv run --all-extras mypy tket scripts
        language: system
        files: \.py$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: cargo-fmt
        name: cargo format
        description: Format rust code with `cargo fmt`.
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: cargo-check
        name: cargo check (tket)
        description: Check rust code with `cargo check`.
        entry: env RUSTFLAGS="-Dwarnings" uv run -- cargo check --all --all-features --workspace --exclude 'pg-*'
        language: system
        files: \.rs$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: cargo-test
        name: cargo nextest r (tket)
        description: Run tests with `cargo nextest r`.
        entry: just tket/test-rust
        language: system
        files: \.rs$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (tket)
        description: Run clippy lints with `cargo clippy`.
        entry: uv run -- cargo clippy --all-features --all-targets --workspace --exclude 'pg-*' -- -D warnings
        language: system
        files: \.rs$
        exclude: ^pg-libs/
        pass_filenames: false
      - id: cargo-doc
        name: cargo doc (tket)
        description: Generate documentation with `cargo doc`.
        entry: uv run -- cargo doc --no-deps --all-features --workspace --exclude 'pg-*'
        language: system
        files: \.rs$
        exclude: ^pg-libs/
        pass_filenames: false
      # pg-libs hooks (scoped to the pg-libs crates and Python tools)
      - id: ruff-format-pg-libs
        name: ruff format (pg-libs)
        description: Format pg-libs python code with `ruff`.
        entry: sh -c "cd pg-libs && just format-python"
        language: system
        files: ^pg-libs/.*\.py$
        pass_filenames: false
      - id: ruff-fix-pg-libs
        name: ruff (pg-libs)
        description: Fix pg-libs python code with `ruff`.
        entry: sh -c "cd pg-libs && just fix-python"
        language: system
        files: ^pg-libs/.*\.py$
        pass_filenames: false
      - id: mypy-check-pg-libs
        name: mypy (pg-libs)
        description: Check pg-libs Python code with `mypy`.
        entry: sh -c "cd pg-libs && uv run --only-group pg-libs mypy ."
        language: system
        files: ^pg-libs/.*\.py$
        pass_filenames: false
      - id: cargo-fmt-pg-libs
        name: cargo format (pg-libs)
        description: Format pg-libs rust code with `cargo fmt`.
        entry: cargo fmt --all -- --check
        language: system
        files: ^pg-libs/.*\.rs$
        pass_filenames: false
      - id: cargo-check-pg-libs
        name: cargo check (pg-libs)
        description: Check pg-libs rust code with `cargo check`.
        entry: sh -c "cd pg-libs && env RUSTFLAGS='-Dwarnings' cargo check -p 'pg-*'"
        language: system
        files: ^pg-libs/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy-pg-libs
        name: cargo clippy (pg-libs)
        description: Run clippy lints on pg-libs with `cargo clippy`.
        entry: sh -c "cd pg-libs && cargo clippy --all-targets -p 'pg-*' -- -D warnings"
        language: system
        files: ^pg-libs/.*\.rs$
        pass_filenames: false
      - id: cargo-test-pg-libs
        name: cargo nextest r (pg-libs)
        description: Run pg-libs tests with `cargo nextest r`.
        entry: sh -c "cd pg-libs && uv run --only-group pg-libs cargo nextest r -p 'pg-*'"
        language: system
        files: ^pg-libs/.*\.rs$
        pass_filenames: false
      - id: py-test
        name: pytest (tket)
        description: Run python tests
        entry: just tket/test-python
        language: system
        files: \.py$
        exclude: ^pg-libs/
        pass_filenames: false
