# Automatic changelog, version bumping, and semver-checks with release-plz for rust projects
name: Release-plz 🦀

on:
  push:
    branches:
      - main

jobs:
  release-plz-pr:
    name: Create release PR (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: tket
            config: release-plz-tket.toml
            hugrenv: true
          - component: pg-libs
            config: release-plz-pg-libs.toml
            hugrenv: false
    # Ensure only one release-plz tries to create a PR at a time.
    #
    # If two instances update the PR simultaneously, one will see an outdated git ref
    # and end up recreating the PR unnecessarily.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.component }}-pr
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install tket and LLVM from hugrenv.lock
        if: matrix.hugrenv
        uses: quantinuum/hugrverse-env/install-hugrenv-action@main
        with:
          packages: "tket,llvm"

      - name: Create release PR
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        with:
          command: release-pr
          config: ${{ matrix.config }}

  # This job triggers the release to crates.io if the current crate version is higher than the
  # ones in the registry.
  #
  # Each config publishes only after merging its own release PR.
  release-plz:
    name: Release crates (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: tket
            config: release-plz-tket.toml
          - component: pg-libs
            config: release-plz-pg-libs.toml
    environment: crate-release
    permissions:
      id-token: write # Required for OIDC token exchange
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.HUGRBOT_PAT }}
        with:
          command: release
          config: ${{ matrix.config }}
